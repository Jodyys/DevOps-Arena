apiVersion: v1
kind: Namespace
metadata:
  name: ns-challenges
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devops-arena-backend
  namespace: ns-challenges
---
apiVersion: v1
kind: Secret
metadata:
  name: devops-arena-backend-token
  namespace: ns-challenges
  annotations:
    kubernetes.io/service-account.name: devops-arena-backend
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: challenge-manager-role
  namespace: ns-challenges
rules:
  # Least privilege: Only allow managing resources inside the ns-challenges namespace
  - apiGroups: ["", "apps", "networking.k8s.io"]
    resources: ["pods", "pods/exec", "deployments", "services", "configmaps", "secrets", "ingress", "ingresses", "endpoints"]
    verbs: ["create", "get", "list", "watch", "delete", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devops-arena-backend-binding
  namespace: ns-challenges
subjects:
  - kind: ServiceAccount
    name: devops-arena-backend
    namespace: ns-challenges
roleRef:
  kind: Role
  name: challenge-manager-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devops-arena-backend
  namespace: ns-devops-arena
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devops-arena-backend-cross-namespace-binding
  namespace: ns-challenges
subjects:
  - kind: ServiceAccount
    name: devops-arena-backend
    namespace: ns-devops-arena
roleRef:
  kind: Role
  name: challenge-manager-role
  apiGroup: rbac.authorization.k8s.io
