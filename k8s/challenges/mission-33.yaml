apiVersion: v1
kind: ConfigMap
metadata:
  name: config-m33
  namespace: ns-challenges
  labels:
    app: m33-config
    challenge-id: ${CHALLENGE_ID}
data:
  APP_PORT: "9999"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: m33-deployment
  namespace: ns-challenges
  labels:
    app: m33-config
    challenge-id: ${CHALLENGE_ID}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: m33-config
      challenge-id: ${CHALLENGE_ID}
  template:
    metadata:
      labels:
        app: m33-config
        challenge-id: ${CHALLENGE_ID}
    spec:
      containers:
      - name: app
        image: alpine:latest
        securityContext:
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
        command: ["/bin/sh", "-c"]
        args:
        - |
          if [ "$APP_PORT" = "8080" ]; then 
            echo "Port is correct. Starting."
            while true; do sleep 3600; done; 
          else 
            echo "Error: Incorrect port configured ($APP_PORT)."
            exit 1; 
          fi
        envFrom:
        - configMapRef:
            name: config-m33
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          limits:
            cpu: "100m"
            memory: "64Mi"
          requests:
            cpu: "50m"
            memory: "32Mi"
