apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-challenge
  labels:
    app: backend-challenge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-challenge
  template:
    metadata:
      labels:
        app: backend-challenge
    spec:
      containers:
      - name: app
        image: busybox:latest
        # BROKEN: Causes a crash loop because it exits immediately
        command: ["/bin/sh", "-c", "echo 'Starting...' && exit 1"]
