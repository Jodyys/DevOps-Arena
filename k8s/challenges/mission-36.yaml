apiVersion: apps/v1
kind: Deployment
metadata:
  name: m36-crashloop
  namespace: ns-challenges
  labels:
    app: m36-crashloop
    challenge-id: ${CHALLENGE_ID}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: m36-crashloop
      challenge-id: ${CHALLENGE_ID}
  template:
    metadata:
      labels:
        app: m36-crashloop
        challenge-id: ${CHALLENGE_ID}
    spec:
      containers:
      - name: alpine
        image: alpine:latest
        command: ["/bin/sh", "-c", "echo 'Fatal Error: Invalid configuration'; exit 1"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          limits:
            cpu: "100m"
            memory: "64Mi"
          requests:
            cpu: "50m"
            memory: "32Mi"
