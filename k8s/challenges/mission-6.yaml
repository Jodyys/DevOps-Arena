apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-challenge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: app
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    # BROKEN: Selector does not match pod labels (app: backend)
    app: backend-old
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
