apiVersion: apps/v1
kind: Deployment
metadata:
  name: m10-dockerfile
  labels:
    app: m10-dockerfile
spec:
  replicas: 1
  selector:
    matchLabels:
      app: m10-dockerfile
  template:
    metadata:
      labels:
        app: m10-dockerfile
    spec:
      containers:
      - name: alpine
        image: alpine:latest
        command: ["/bin/sh", "-c"]
        args:
        - |
          mkdir -p /workspace
          cat << 'EOF' > /workspace/Dockerfile
          FROM node:18-alpine
          WORKDIR /app
          COPY package.json .
          RUN npm install
          COPY . .
          CMD ["npm start"]
          EOF
          apk add --no-cache nano
          while true; do sleep 3600; done

