apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-m22
  namespace: ns-challenges
  labels:
    app: cicd-m22
    challenge-id: ${CHALLENGE_ID}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cicd-m22
      challenge-id: ${CHALLENGE_ID}
  template:
    metadata:
      labels:
        app: cicd-m22
        challenge-id: ${CHALLENGE_ID}
    spec:
      containers:
      - name: alpine
        image: node:18-alpine
        command: ["/bin/sh", "-c"]
        args:
          - |
            mkdir -p /workspace
            cat << 'EOF' > /workspace/test.js
            function add(a, b) { return a + b; }
            const result = add(2, 3);
            if (result !== 4) {
              console.error("Test failed! Expected 4 but got " + result);
              process.exit(1);
            }
            console.log("Test passed!");
            EOF
            apk add --no-cache nano
            while true; do sleep 3600; done
