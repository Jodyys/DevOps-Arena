apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-challenge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-challenge
  template:
    metadata:
      labels:
        app: frontend-challenge
    spec:
      containers:
      - name: frontend
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  selector:
    # Intentionally broken selector
    app: frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
