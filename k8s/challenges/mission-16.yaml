apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-port
  namespace: ns-challenges
  labels:
    app: bad-port
    challenge-id: ${CHALLENGE_ID}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bad-port
      challenge-id: ${CHALLENGE_ID}
  template:
    metadata:
      labels:
        app: bad-port
        challenge-id: ${CHALLENGE_ID}
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        command: ["/bin/sh", "-c", "sed -i 's/80/8080/g' /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"]
