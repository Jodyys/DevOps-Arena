apiVersion: v1
kind: Secret
metadata:
  name: m37-secret
  namespace: ns-challenges
  labels:
    app: m37-secret
    challenge-id: ${CHALLENGE_ID}
type: Opaque
stringData:
  APP_MODE: development
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: m37-secret-deploy
  namespace: ns-challenges
  labels:
    app: m37-secret
    challenge-id: ${CHALLENGE_ID}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: m37-secret
      challenge-id: ${CHALLENGE_ID}
  template:
    metadata:
      labels:
        app: m37-secret
        challenge-id: ${CHALLENGE_ID}
    spec:
      containers:
      - name: alpine
        image: alpine:latest
        securityContext:
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
        command: ["/bin/sh", "-c"]
        args:
        - |
          if [ "$APP_MODE" = "production" ]; then 
            echo "Environment is properly configured for production. Starting."
            while true; do sleep 3600; done; 
          else 
            echo "Error: Application must be run in production mode!"
            echo "Current APP_MODE=$APP_MODE"
            exit 1; 
          fi
        envFrom:
        - secretRef:
            name: m37-secret
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          limits:
            cpu: "100m"
            memory: "64Mi"
          requests:
            cpu: "50m"
            memory: "32Mi"
