apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-m21
  namespace: ns-challenges
  labels:
    app: cicd-m21
    challenge-id: ${CHALLENGE_ID}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cicd-m21
      challenge-id: ${CHALLENGE_ID}
  template:
    metadata:
      labels:
        app: cicd-m21
        challenge-id: ${CHALLENGE_ID}
    spec:
      containers:
      - name: alpine
        image: alpine:latest
        command: ["/bin/sh", "-c"]
        args:
          - |
            mkdir -p /workspace
            cat << 'EOF' > /workspace/Jenkinsfile
            pipeline {
              agent any
              stages {
                stage('Build') {
                  steps {
                    echo 'Building..'
                  }
                }
              // Syntax error: missing closing brace for stages
            }
            EOF
            while true; do sleep 3600; done
