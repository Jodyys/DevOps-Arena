apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-arena-ingress
  namespace: ns-devops-arena
  annotations:
    # Use nginx ingress controller
    kubernetes.io/ingress.class: "nginx"
    # To route /api to the backend without stripping the path, we don't need a rewrite target
    # because the backend expects /api/* routes natively.
spec:
  rules:
    - host: devops-arena.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3001
