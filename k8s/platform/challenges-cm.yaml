        app: m38-ingress
        challenge-id: ${CHALLENGE_ID}
      ports:
        - protocol: TCP
          port: 80
          targetPort: 80
    ---
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: m38-ingress
      namespace: ns-challenges
      labels:
        app: m38-ingress
        challenge-id: ${CHALLENGE_ID}
