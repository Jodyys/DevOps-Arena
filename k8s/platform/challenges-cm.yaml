  mission-1.yaml: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: m1-dockerfile\n
    \ labels:\n    app: m1-dockerfile\nspec:\n  replicas: 1\n  selector:\n    matchLabels:\n
    \     app: m1-dockerfile\n  template:\n    metadata:\n      labels:\n        app:
    m1-dockerfile\n    spec:\n      containers:\n      - name: alpine\n        image:
    alpine:latest\n        command: [\"/bin/sh\", \"-c\"]\n        args:\n        -
    |\n          mkdir -p /workspace\n          cat << 'EOF' > /workspace/Dockerfile\n
    \         FROM node:18-alpine\n          WORKDIR /app\n          COPY package.json
    .\n          COPY . .\n          CMD [\"npm\", \"start\"]\n          EOF\n          apk
    add --no-cache nano\n          while true; do sleep 3600; done\n\r\n"
