              mkdir -p /workspace
              echo 'version: "3"' > /workspace/docker-compose.yml
              echo 'services:' >> /workspace/docker-compose.yml
              echo '  web:' >> /workspace/docker-compose.yml
              echo '    image: nginx' >> /workspace/docker-compose.yml
              echo '    ports:' >> /workspace/docker-compose.yml
              echo '      - "8080:80"' >> /workspace/docker-compose.yml
              while true; do sleep 3600; done
