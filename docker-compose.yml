services:
  postgres:
    image: postgres:15-alpine
    container_name: devops-arena-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devops_arena}
      POSTGRES_USER: ${POSTGRES_USER:-devops_arena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devops_arena} -d ${POSTGRES_DB:-devops_arena}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - devops-arena-network

  redis:
    image: redis:7-alpine
    container_name: devops-arena-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - devops-arena-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devops-arena-backend
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - FRONTEND_URL=${FRONTEND_URL}
      - K8S_API_URL=${K8S_API_URL}
      - K8S_TOKEN=${K8S_TOKEN}
      - K8S_CA_CERT=${K8S_CA_CERT}
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "desktop-control-plane:host-gateway"
    volumes:
      - ./k8s/challenges:/k8s/challenges
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - devops-arena-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devops-arena-frontend
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    environment:
      - NEXT_PUBLIC_API_URL=/api
    depends_on:
      - backend
    networks:
      - devops-arena-network

networks:
  devops-arena-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
